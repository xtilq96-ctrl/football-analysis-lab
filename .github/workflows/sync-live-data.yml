name: Sync live Sporttery data

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-sporttery-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download signed collector snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import time
          import urllib.request

          url = "https://118.195.198.175/api/latest"
          for attempt in range(4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"Accept": "application/json", "User-Agent": "FootballAI-GitHub-Sync/2.0"},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      signature = response.headers.get("X-Football-Signature", "")
                  payload = json.loads(body)
                  if not signature or payload.get("count") != len(payload.get("matches", [])) or not payload.get("count"):
                      raise RuntimeError("collector snapshot validation failed")
                  with open("latest.json", "w", encoding="utf-8") as stream:
                      json.dump(
                          {"bodyBase64": base64.b64encode(body).decode("ascii"), "signature": signature},
                          stream,
                          separators=(",", ":"),
                      )
                      stream.write("\n")
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 ** attempt)
          PY

      - name: Publish one-file live-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init publish
          cd publish
          git config user.name "football-ai-bot"
          git config user.email "football-ai-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --orphan live-data
          cp ../latest.json latest.json
          printf '%s\n' '# Football AI live data' > README.md
          git add latest.json README.md
          git commit -m "Update live Sporttery data"
          git push --force origin live-data
