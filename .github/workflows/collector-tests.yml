name: Collector tests

on:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/collector-tests.yml"
  pull_request:
    paths:
      - "collector/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s collector/tests -v
